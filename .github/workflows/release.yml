name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version as MAJOR.MINOR.PATCH (leading v optional)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.norm.outputs.tag }}
      version: ${{ steps.norm.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and validate version
        id: norm
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ver="${RAW#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH (got: ${RAW})"
            exit 1
          fi
          tag="v${ver}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists on origin"
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Using tag ${tag}"

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev zlib1g-dev

      - name: Build and test
        run: make build test

      - name: Name binary
        run: |
          set -euo pipefail
          mv anka-layer-editor "anka-layer-editor-${{ matrix.target }}"
          ls -la "anka-layer-editor-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anka-layer-editor-${{ matrix.target }}
          path: anka-layer-editor-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create tag and release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: anka-layer-editor-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -f dist/anka-layer-editor-darwin-arm64
          test -f dist/anka-layer-editor-linux-amd64
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            dist/anka-layer-editor-darwin-arm64 \
            dist/anka-layer-editor-linux-amd64 \
            --title "$TAG" \
            --notes "Release $TAG"
